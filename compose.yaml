# De Uitkijk — local development stack.
#
#   docker compose up --build          # mock mode: simulated cameras and alerts, no network access needed
#   open http://127.0.0.1:8080         # dashboard;  http://127.0.0.1:8080/dev  scenario panel
#
# Live mode (trusted development network only): see docs/development.md.
# Only the edge proxy is published, on 127.0.0.1 by default. go2rtc and the backend have no host ports.
name: de-uitkijk

services:
  go2rtc:
    image: alexxit/go2rtc:1.9.15@sha256:e098de5c2f8040dc3d4784ed2d5cfdac3b0979f9349afe587ef6a670a14b9f4d
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
    # Development: camera credentials come from .env and are substituted by go2rtc (live.yaml).
    # Production: GO2RTC_CONFIG_PATH points to a host file outside the repository that holds the
    # complete config including credentials, so the environment (shared by all services) has none.
    env_file:
      - path: .env
        required: false
    volumes:
      - ${GO2RTC_CONFIG_PATH:-./go2rtc/mock.yaml}:/config/go2rtc.yaml:ro
      - ./go2rtc/mock-camera.sh:/config/mock-camera.sh:ro

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      UITKIJK_MODE: ${UITKIJK_MODE:-mock}
      UITKIJK_CAMERA_CONFIG: /app/config/${UITKIJK_CAMERA_FILE:-cameras.json}
      UITKIJK_MOCK_SCENARIO: ${UITKIJK_MOCK_SCENARIO:-demo}
      FRIGATE_URL: ${FRIGATE_URL:-}
      FRIGATE_POLL_MS: ${FRIGATE_POLL_MS:-2000}
      GO2RTC_URL: http://go2rtc:1984
      # Accounts and sessions for access from outside the LAN (SQLite).
      UITKIJK_DATA_DIR: /data
      UITKIJK_PUBLIC_URL: ${UITKIJK_PUBLIC_URL:-http://127.0.0.1:8081}
      # Login is always on in live mode; UITKIJK_LOGIN=on also enables it in mock mode (development).
      UITKIJK_LOGIN: ${UITKIJK_LOGIN:-}
      UITKIJK_AI: ${UITKIJK_AI:-}
      UITKIJK_AI_MODEL: ${UITKIJK_AI_MODEL:-}
      # Optional Frigate viewer account and pinned certificate (JSON) for the authenticated API on port 8971.
      FRIGATE_AUTH_FILE: /run/uitkijk/frigate-auth.json
    volumes:
      - ./config:/app/config:ro
      - data:/data
      - ${FRIGATE_AUTH_HOST_FILE:-/dev/null}:/run/uitkijk/frigate-auth.json:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [server, go2rtc]
    networks:
      default: {}
      edge:
        # SWAG proxies to de-uitkijk:8081 (public listener).
        aliases: [de-uitkijk]
    ports:
      # Home LAN listener: no login.
      - "${UITKIJK_BIND:-127.0.0.1}:${UITKIJK_PORT:-8080}:8080"
      # Public listener (login required). Production reaches it from SWAG over the edge network;
      # the host port stays on loopback for local testing.
      - "127.0.0.1:${UITKIJK_PUBLIC_PORT:-8081}:8081"

volumes:
  data:

networks:
  # Production: the existing SWAG network (UITKIJK_EDGE_NETWORK=swag_default, UITKIJK_EDGE_NETWORK_EXTERNAL=true).
  edge:
    name: ${UITKIJK_EDGE_NETWORK:-de-uitkijk_edge}
    external: ${UITKIJK_EDGE_NETWORK_EXTERNAL:-false}
